<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Create your account</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --muted: #65708a;
        --border: #dce2ed;
        --primary: #5546e8;
        --primary-dark: #4335c5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(ellipse at 12% 8%, #e8e7ff 0, transparent 34%),
          radial-gradient(ellipse at 92% 92%, #e4f4f3 0, transparent 30%),
          #f5f7fb;
      }

      .card {
        width: min(100%, 460px);
        padding: 42px;
        border: 1px solid rgba(220, 226, 237, 0.85);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 70px rgba(37, 46, 77, 0.1);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
        color: #25304a;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        background: var(--primary);
        color: white;
        font-size: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 34px);
        letter-spacing: -0.045em;
        line-height: 1.15;
      }

      .intro {
        margin: 11px 0 28px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      form {
        display: grid;
        gap: 17px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      label {
        color: #303b54;
        font-size: 13px;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 48px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: #172033;
        font: inherit;
        font-size: 14px;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      input::placeholder {
        color: #9aa3b5;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(85, 70, 232, 0.13);
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .terms {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 2px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .terms input {
        flex: 0 0 16px;
        width: 16px;
        min-height: 16px;
        height: 16px;
        margin: 2px 0 0;
        accent-color: var(--primary);
      }

      a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      button {
        min-height: 49px;
        margin-top: 2px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        transition: background 150ms ease, transform 150ms ease;
      }

      button:hover {
        background: var(--primary-dark);
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(85, 70, 232, 0.35);
        outline-offset: 3px;
      }

      .login {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      @media (max-width: 480px) {
        .card {
          padding: 30px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="#" aria-label="Home">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>Northstar</span>
      </a>

      <h1>Create your account</h1>
      <p class="intro">Get started today. It only takes a minute to set up your account.</p>

      <form action="/register" method="post">
        <div class="field">
          <label for="full-name">Full name</label>
          <input id="full-name" name="name" type="text" autocomplete="name" placeholder="Jane Smith" required>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
          <p class="hint">Use at least 8 characters.</p>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Enter your password again" required>
        </div>

        <label class="terms">
          <input name="terms" type="checkbox" required>
          <span>I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</span>
        </label>

        <button type="submit">Create account</button>
      </form>

      <p class="login">Already have an account? <a href="#login">Sign in</a></p>
    </main>

  </body>
</html>
